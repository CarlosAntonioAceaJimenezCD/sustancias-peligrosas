name: Deploy Dioxus a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain Rust + WASM
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Caché de Cargo
        uses: Swatinem/rust-cache@v2

      - name: Instalar dioxus-cli
        run: cargo install dioxus-cli --locked

      - name: Compilar aplicación web
        run: dx build --release

      - name: Soporte de rutas del cliente
        run: cp target/dx/sustancias-web/release/web/public/index.html target/dx/sustancias-web/release/web/public/404.html

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/dx/sustancias-web/release/web/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
