name: Deploy Dioxus a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  audit:
    name: Auditoría de dependencias (RustSec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Comprobar CVEs (avisos transitivos documentados)
        run: >-
          cargo audit --ignore
          RUSTSEC-2025-0057,
          RUSTSEC-2024-0436,
          RUSTSEC-2024-0370,
          RUSTSEC-2024-0429,
          RUSTSEC-2026-0097,
          RUSTSEC-2026-0543,
          RUSTSEC-2026-0592

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain Rust + WASM
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Caché de Cargo
        uses: Swatinem/rust-cache@v2

      - name: Instalar dioxus-cli
        run: cargo install dioxus-cli --locked

      - name: Compilar aplicación web
        run: dx build --release --package sustancias-web

      - name: Soporte de rutas del cliente
        run: cp target/dx/sustancias-web/release/web/public/index.html target/dx/sustancias-web/release/web/public/404.html

      - name: Política de seguridad (CSP)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          csp = (
              "default-src 'self'; "
              "script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; "
              "style-src 'self' 'unsafe-inline'; "
              "img-src 'self' data:; "
              "connect-src 'self' https://pubchem.ncbi.nlm.nih.gov "
              "https://translate.googleapis.com https://www.boe.es; "
              "font-src 'self' data:; object-src 'none'; base-uri 'self'"
          )
          meta = f'<meta http-equiv="Content-Security-Policy" content="{csp}">'
          base = Path('target/dx/sustancias-web/release/web/public')
          for nombre in ('index.html', '404.html'):
              ruta = base / nombre
              html = ruta.read_text(encoding='utf-8')
              if 'Content-Security-Policy' not in html:
                  html = html.replace('<head>', '<head>' + meta, 1)
                  ruta.write_text(html, encoding='utf-8')
          print('CSP inyectada en index.html y 404.html')
          PY

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/dx/sustancias-web/release/web/public

  deploy:
    needs: [build, audit]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
