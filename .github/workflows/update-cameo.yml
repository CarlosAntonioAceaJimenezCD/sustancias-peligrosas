name: Revisar cambios en CAMEO

on:
  schedule:
    # El día 1 de cada mes a las 06:00 UTC
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Comprobar base de reactividad
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comprobar cambios
        id: check
        run: |
          set +e
          python3 scripts/update-cameo.py > resultado.txt 2>&1
          codigo=$?
          cat resultado.txt
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          if [ "$codigo" -eq 2 ]; then
            exit 0
          fi
          exit "$codigo"

      - name: Abrir issue si hay cambios
        if: steps.check.outputs.codigo == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('resultado.txt', 'utf8')
              .replace('CAMBIOS DETECTADOS', '## Cambios detectados en NOAA/EPA CAMEO\n')
              .replace(/\nIssue sugerido:[\s\S]*$/, '\n\nRevisar y actualizar los datos manualmente antes de aceptarlos.');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[cameo] Revisar cambios en la base de reactividad',
              body: body,
              labels: ['datos', 'mantenimiento']
            });
