[workspace]
resolver = "2"
members = ["crates/core", "crates/dbtool", "crates/storage", "crates/web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package."*"]
opt-level = "z"
codegen-units = 1
