[workspace]
resolver = "2"
members = ["crates/core", "crates/i18n", "crates/storage", "crates/web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1

[profile.release.package."*"]
opt-level = "z"
codegen-units = 1

# Perfil para binarios nativos: menos tamaño y arranque mas rapido.
# No se usa en WASM (strip rompe wasm-bindgen).
[profile.native-release]
inherits = "release"
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
